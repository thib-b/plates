<!DOCTYPE html>
<html>
<head>
  <title>ZIM Petri Dish</title>
  <script src="https://zimjs.org/cdn/1.3.2/createjs.js?v=1"></script>
  <script src="https://zimjs.org/cdn/cat/01/zim.js?v=1"></script>
  <style>
    body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 5px;
    }
    #ui button {
      margin: 5px 0;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>Population: <span id="popCount">0</span></div>
    <div>FPS: <span id="fpsCount">0</span></div>
    <button id="pauseBtn">Pause</button>
    <button id="clearBtn">Clear</button>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
