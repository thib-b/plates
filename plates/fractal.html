<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractal Garden Plate</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="fractal.js"></script>
  <script>
    function toggleControls() {
      const controls = document.querySelector('.controls');
      const toggle = document.querySelector('.controls-toggle');
      controls.classList.toggle('expanded');
      toggle.textContent = controls.classList.contains('expanded') ? 'Controls ▲' : 'Controls ▼';
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
    }
    canvas {
      display: block;
      z-index: 1;
    }
    
    .controls-toggle {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 15px;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      z-index: 100;
    }
    .controls-toggle:hover {
      background: rgba(74, 74, 106, 0.9);
    }
    
    .controls {
      position: absolute;
      top: 55px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      color: #fff;
      max-width: 250px;
    }
    .controls h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 14px;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }
    .controls label {
      display: block;
      margin: 10px 0 5px;
      font-size: 12px;
    }
    .controls input, .controls select {
      width: 100%;
      padding: 5px;
      box-sizing: border-box;
    }
    .controls button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #4a4a6a;
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }
    .controls button:hover {
      background: #5a5a7a;
    }
    .controls-content {
      display: none;
      margin-top: 5px;
    }
    .controls.expanded .controls-content {
      display: block;
    }
    
    .info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 10px;
      color: #fff;
      font-size: 11px;
      max-width: 250px;
    }
  </style>
</head>
<body>
  <div class="controls-toggle" onclick="toggleControls()">Controls ▼</div>
  <div class="controls">
    <div class="controls-content">
      <h2>Fractal Garden Controls</h2>
      <label>Branch Length: <input type="range" id="branch-length" min="10" max="100" value="50"></label>
      <label>Branch Angle: <input type="range" id="branch-angle" min="10" max="80" value="25"></label>
      <label>Recursion Depth: <input type="range" id="max-depth" min="1" max="8" value="5"></label>
      <label>Branch Ratio: <input type="range" id="branch-ratio" min="0.3" max="0.9" step="0.1" value="0.6"></label>
      <label>Angle Variation: <input type="range" id="angle-variation" min="0" max="45" value="10"></label>
      <button id="restart-fractal">Restart</button>
      <button id="clear-plate">Clear Plate</button>
    </div>
  </div>

  <div class="info">
    <p><strong>Fractal Garden Plate</strong></p>
    <p>Recursive branching patterns</p>
    <p>SPACE: pause / R: restart / C: clear / S: save / Click: add fractal</p>
    <p><a href="../index.html" style="color: #1890ff;">← Back to Plates</a></p>
  </div>

  <div id="canvas-container"></div>
</body>
</html>
