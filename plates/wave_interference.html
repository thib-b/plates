<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Interference Plate</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="wave_interference.js"></script>
  <script>
    function toggleControls() {
      const controls = document.querySelector('.controls');
      const toggle = document.querySelector('.controls-toggle');
      controls.classList.toggle('expanded');
      toggle.textContent = controls.classList.contains('expanded') ? 'Controls ▲' : 'Controls ▼';
    }
  </script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #1a1a2e; font-family: 'Courier New', monospace; }
    .controls { position: absolute; top: 55px; left: 20px; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; color: #fff; max-width: 250px; }
    .controls h2 { margin: 0 0 15px; font-size: 14px; border-bottom: 1px solid #444; padding-bottom: 10px; }
    .controls label { display: block; margin: 10px 0 5px; font-size: 12px; }
    .controls input, .controls select { width: 100%; padding: 5px; box-sizing: border-box; }
    .controls button { width: 100%; padding: 10px; margin-top: 10px; background: #4a4a6a; border: none; border-radius: 5px; color: #fff; cursor: pointer; font-family: 'Courier New', monospace; }
    .controls button:hover { background: #5a5a7a; }
    .controls-content { display: none; margin-top: 5px; }
    .controls.expanded .controls-content { display: block; }
    .controls-toggle { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 5px; color: #fff; cursor: pointer; font-family: 'Courier New', monospace; font-size: 12px; z-index: 100; }
    .controls-toggle:hover { background: rgba(74,74,106,0.9); }
    .info { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; color: #fff; font-size: 11px; max-width: 250px; }
  </style>
</head>
<body>
  <div class="controls-toggle" onclick="toggleControls()">Controls ▼</div>
  <div class="controls">
    <div class="controls-content">
      <h2>Wave Interference</h2>
      <label>FPS: <span id="fps">0</span></label>
      <label for="emitter-count">Emitters (2-8):</label>
      <input type="range" id="emitter-count" min="2" max="8" value="4">
      <label for="frequency">Frequency:</label>
      <input type="range" id="frequency" min="0.01" max="0.2" value="0.05" step="0.01">
      <label for="wave-speed">Wave Speed:</label>
      <input type="range" id="wave-speed" min="0.5" max="5" value="2" step="0.1">
      <label for="damping">Damping:</label>
      <input type="range" id="damping" min="0" max="1" value="0.98" step="0.01">
      <label for="amplitude">Amplitude:</label>
      <input type="range" id="amplitude" min="1" max="20" value="10">
      <label for="wavelength">Wavelength:</label>
      <input type="range" id="wavelength" min="10" max="200" value="50">
      <label for="color-mode">Color Mode:</label>
      <select id="color-mode">
        <option value="rainbow">Rainbow</option><option value="grayscale">Grayscale</option>
        <option value="heat">Heat Map</option><option value="ocean">Ocean</option>
      </select>
      <button id="randomize-emitters">Randomize Emitters</button>
      <button id="reset">Reset</button>
    </div>
  </div>
  <div class="info">
    <p><strong>Wave Interference Plate</strong></p>
    <p>Multiple emitters create constructive/destructive interference patterns</p>
    <p>SPACE: pause / R: reset / C: clear / S: save</p>
    <p><a href="../index.html" style="color: #1890ff;">← Back to Plates</a></p>
  </div>
  <div id="canvas-container"></div>
  <script src="wave_interference.js"></script>
</body>
</html>
