<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Petri Dish / Agar Plate</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="petri.js"></script>
  <script>
    function toggleControls() {
      const controls = document.querySelector('.controls');
      const toggle = document.querySelector('.controls-toggle');
      controls.classList.toggle('expanded');
      toggle.textContent = controls.classList.contains('expanded') ? 'Controls ▲' : 'Controls ▼';
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Courier New', monospace;
    }
    .container {
      display: flex;
    }
    #canvas-container {
      flex: 1;
    }
    .controls {
      position: absolute;
      top: 55px;  /* Below toggle button */
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      color: #fff;
      max-width: 250px;
    }
    .controls h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 14px;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }
    .controls label {
      display: block;
      margin: 10px 0 5px;
      font-size: 12px;
    }
    .controls input, .controls select {
      width: 100%;
      padding: 5px;
      box-sizing: border-box;
    }
    .controls button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #4a4a6a;
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }
    .controls button:hover {
      background: #5a5a7a;
    }
    .info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 10px;
      color: #fff;
      font-size: 11px;
      max-width: 250px;
    }
    .controls-toggle {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 15px;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      z-index: 100;
    }
    .controls-toggle:hover {
      background: rgba(74, 74, 106, 0.9);
    }
    .controls-content {
      display: none;
      margin-top: 5px;
    }
    .controls.expanded .controls-content {
      display: block;
    }
  </style>
</head>
<body>
  <div class="controls-toggle" onclick="toggleControls()">Controls ▼</div>
  <div class="controls">
    <div class="controls-content">
      <h2>Petri Dish Controls</h2>
      <label>Population: <span id="pop-count">0</span></label>
      <label>FPS: <span id="fps">0</span></label>
      <button id="add-organism">Add Organism (Click on Plate)</button>
      <button id="clear-plate">Clear Plate</button>
      <button id="randomize">Add 5 Organisms</button>
      
      <label for="spawn-rate">Spawn Rate:</label>
      <input type="range" id="spawn-rate" min="0" max="0.1" value="0.02" step="0.001">
      
      <label for="reproduce-rate">Reproduce Rate:</label>
      <input type="range" id="reproduce-rate" min="0" max="0.1" value="0.01" step="0.001">
      
      <label for="merge-threshold">Merge Threshold:</label>
      <input type="range" id="merge-threshold" min="0" max="255" value="50">
      
      <label for="avoid-threshold">Avoid Threshold:</label>
      <input type="range" id="avoid-threshold" min="0" max="255" value="120">
      
      <label for="plate-radius">Plate Radius:</label>
      <input type="range" id="plate-radius" min="100" max="500" value="300">
    </div>
  </div>
  
  <div class="info">
    <p><strong>Controls:</strong></p>
    <p>Click on the plate to add organisms</p>
    <p>SPACE: pause / R: reset / C: clear / S: save</p>
    <p><a href="../index.html" style="color: #1890ff;">← Back to Plates</a></p>
  </div>
  
  <div id="canvas-container"></div>
</body>
</html>
