<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crack Formation Plate</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/gohai/p5.Polar@1.0.0/p5.Polar.js"></script>
  <script>
    function toggleControls() {
      const controls = document.querySelector('.controls');
      const toggle = document.querySelector('.controls-toggle');
      controls.classList.toggle('expanded');
      toggle.textContent = controls.classList.contains('expanded') ? 'Controls ▲' : 'Controls ▼';
    }
    function updateSpeed(v) { propagationSpeed = parseFloat(v); }
    function updateBranching(v) { branchingProbability = parseFloat(v); }
    function updateThreshold(v) { stressThreshold = parseInt(v); }
    function updateSubstrate(v) { substrateColor = v; document.getElementById('substrate-preview').style.backgroundColor = v; }
  </script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #1a1a2e; font-family: 'Courier New', monospace; }
    canvas { display: block; z-index: 1; }
    .controls-toggle {
      position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7);
      padding: 8px 15px; border-radius: 5px; color: #fff; cursor: pointer;
      font-family: 'Courier New', monospace; font-size: 12px; z-index: 100;
    }
    .controls-toggle:hover { background: rgba(74,74,106,0.9); }
    .controls {
      position: absolute; top: 55px; left: 20px; background: rgba(0,0,0,0.7);
      padding: 20px; border-radius: 10px; color: #fff; max-width: 250px;
    }
    .controls h2 { margin-top: 0; margin-bottom: 15px; font-size: 14px; border-bottom: 1px solid #444; padding-bottom: 10px; }
    .controls label { display: block; margin: 10px 0 5px; font-size: 12px; }
    .controls input { width: 100%; padding: 5px; box-sizing: border-box; }
    .controls button {
      width: 100%; padding: 10px; margin-top: 10px; background: #4a4a6a; border: none; border-radius: 5px; color: #fff; cursor: pointer;
      font-family: 'Courier New', monospace;
    }
    .controls button:hover { background: #5a5a7a; }
    .controls-content { display: none; margin-top: 5px; }
    .controls.expanded .controls-content { display: block; }
    .info {
      position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7);
      padding: 15px; border-radius: 10px; color: #fff; font-size: 11px; max-width: 250px;
    }
    .color-preview {
      width: 20px; height: 20px; display: inline-block; border: 1px solid #666;
      vertical-align: middle; margin-left: 5px;
    }
  </style>
</head>
<body>
  <div class="controls-toggle" onclick="toggleControls()">Controls ▼</div>
  <div class="controls">
    <div class="controls-content">
      <h2>Crack Formation Controls</h2>
      <label>Cracks: <span id="crack-count">0</span></label>
      <label>FPS: <span id="fps">0</span></label>
      <button id="add-crack">Add Crack (Click on Plate)</button>
      <button id="clear-plate">Clear Plate</button>
      <button id="random-seeds">Add 5 Random Seeds</button>
      <label>Propagation Speed: <input type="range" id="propagation-speed" min="0.01" max="0.5" value="0.1" step="0.01" oninput="updateSpeed(this.value)"></label>
      <label>Branching Probability: <input type="range" id="branching-prob" min="0" max="1" value="0.3" step="0.05" oninput="updateBranching(this.value)"></label>
      <label>Stress Threshold: <input type="range" id="stress-threshold" min="1" max="100" value="50" oninput="updateThreshold(this.value)"></label>
      <label>Substrate Color:
        <select id="substrate-color" onchange="updateSubstrate(this.value)">
          <option value="#4a3c30">Clay Brown</option>
          <option value="#2a2a3a">Dark Slate</option>
          <option value="#3a4a30">Moss Green</option>
          <option value="#4a3a4a">Dusty Rose</option>
          <option value="#304a4a">Teal Dark</option>
          <option value="#3a3a4a">Charcoal</option>
        </select>
        <span id="substrate-preview" class="color-preview" style="background-color: #4a3c30;"></span>
      </label>
      <label>Plate Radius: <input type="range" id="plate-radius" min="100" max="500" value="300" oninput="plateRadius = parseInt(this.value)"></label>
    </div>
  </div>
  <div class="info">
    <p><strong>Crack Formation Plate</strong></p>
    <p>Click on the plate to add crack seeds</p>
    <p>Cracks propagate and branch based on stress</p>
    <p>SPACE: pause / R: reset / C: clear / S: save</p>
    <p><a href="../index.html" style="color: #1890ff;">← Back to Plates</a></p>
  </div>
  <div id="canvas-container"></div>
  <script src="crack.js"></script>
</body>
</html>
