<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metaball Fusion Plate</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="metaball.js"></script>
  <script>
    function toggleControls() {
      const controls = document.querySelector('.controls');
      const toggle = document.querySelector('.controls-toggle');
      controls.classList.toggle('expanded');
      toggle.textContent = controls.classList.contains('expanded') ? 'Controls ▲' : 'Controls ▼';
    }
  </script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
    canvas { display: block; z-index: 1; }
    .controls-toggle {
      position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7);
      padding: 8px 15px; border-radius: 5px; color: #fff; cursor: pointer;
      font-family: 'Courier New', monospace; font-size: 12px; z-index: 100;
    }
    .controls-toggle:hover { background: rgba(74,74,106,0.9); }
    .controls {
      position: absolute; top: 55px; left: 20px; background: rgba(0,0,0,0.7); padding: 20px;
      border-radius: 10px; color: #fff; max-width: 250px;
    }
    .controls h2 { margin-top: 0; margin-bottom: 15px; font-size: 14px; border-bottom: 1px solid #444; padding-bottom: 10px; }
    .controls label { display: block; margin: 10px 0 5px; font-size: 12px; }
    .controls input, .controls select { width: 100%; padding: 5px; box-sizing: border-box; }
    .controls button {
      width: 100%; padding: 10px; margin-top: 10px; background: #4a4a6a; border: none;
      border-radius: 5px; color: #fff; cursor: pointer; font-family: 'Courier New', monospace;
    }
    .controls button:hover { background: #5a5a7a; }
    .controls-content { display: none; margin-top: 5px; }
    .controls.expanded .controls-content { display: block; }
    .info {
      position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7);
      padding: 15px; border-radius: 10px; color: #fff; font-size: 11px; max-width: 250px;
    }
  </style>
</head>
<body>
  <div class="controls-toggle" onclick="toggleControls()">Controls ▼</div>
  <div class="controls">
    <div class="controls-content">
      <h2>Metaball Controls</h2>
      <label>Count: <span id="ball-count">10</span></label>
      <label>FPS: <span id="fps">0</span></label>
      <label for="ball-count-slider">Ball Count:</label>
      <input type="range" id="ball-count-slider" min="5" max="15" value="10">
      <label for="min-radius">Min Radius:</label>
      <input type="range" id="min-radius" min="20" max="80" value="50">
      <label for="max-radius">Max Radius:</label>
      <input type="range" id="max-radius" min="80" max="150" value="100">
      <label for="speed">Speed:</label>
      <input type="range" id="speed" min="0.1" max="3" value="1" step="0.1">
      <label for="threshold">Blend Threshold:</label>
      <input type="range" id="threshold" min="0.1" max="2" value="0.8" step="0.05">
      <label for="blend-mode">Blend Mode:</label>
      <select id="blend-mode">
        <option value="lerp">Lerp</option>
        <option value="screen">Screen</option>
        <option value="multiply">Multiply</option>
        <option value="add">Add</option>
        <option value="lightest">Lightest</option>
        <option value="darkest">Darkest</option>
      </select>
      <button id="randomize">Randomize Colors</button>
      <button id="reset">Reset Balls</button>
    </div>
  </div>
  <div class="info">
    <p><strong>Metaball Fusion</strong></p>
    <p>Soft blobs merge smoothly when overlapping</p>
    <p>SPACE: pause / R: reset / S: save</p>
    <p><a href="../index.html" style="color: #1890ff;">← Back to Plates</a></p>
  </div>
  <div id="canvas-container"></div>
  <script src="metaball.js"></script>
</body>
</html>
